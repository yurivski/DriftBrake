# driftbrake.policy.example.yml
# Copie para driftbrake.policy.yml e ajuste conforme o seu projeto.
#
# Este é o arquivo de POLÍTICA, lido pela BIBLIOTECA (não pela CLI):
#
#   from driftbrake import DriftBrake
#   DriftBrake.from_env(policy_path="driftbrake.policy.yml").protect()
#
# É o mecanismo que de fato funciona hoje para sobrescrever severidades e
# ignorar tabelas/colunas. As mudanças são aplicadas como pós-processamento
# sobre o resultado da comparação (DriftBrake.evaluate / protect).

# Sobrescreve a severidade padrão de um change_type.
# Chave = valor do change_type (ex.: ordinal_position_changed, index_removed).
# Valor = BREAKING | WARNING | SAFE
overrides:
  ordinal_position_changed: SAFE
  index_removed: SAFE

# Ignora tabelas inteiras: nenhuma mudança nelas é reportada.
ignore_tables:
  - alembic_version
  - django_migrations
  - flyway_schema_history

# Ignora colunas específicas. Formato exato: "tabela.coluna".
ignore_columns:
  - orders.updated_at
  - customers.last_login
